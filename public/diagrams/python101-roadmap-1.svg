<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 205" role="img" aria-labelledby="title desc"><title id="title">เส้นทางเรียนรู้สี่สัปดาห์</title><desc id="desc">สัปดาห์แรกเรียนไวยากรณ์และการรับข้อมูล สัปดาห์ที่สองเรียนเงื่อนไข ลูป และข้อมูล สัปดาห์ที่สามเรียนฟังก์ชัน ไฟล์ และข้อผิดพลาด สัปดาห์ที่สี่เรียน OOP และโครงงาน แล้วเลือกเรียนต่อด้านเว็บ ข้อมูล ระบบอัตโนมัติ หรือ AI</desc><metadata>flowchart LR
  A[&quot;สัปดาห์ 1&lt;br/&gt;Syntax และ Input&quot;] --&gt; B[&quot;สัปดาห์ 2&lt;br/&gt;Condition, Loop, Data&quot;]
  B --&gt; C[&quot;สัปดาห์ 3&lt;br/&gt;Function, File, Error&quot;]
  C --&gt; D[&quot;สัปดาห์ 4&lt;br/&gt;OOP และ Projects&quot;]
  D --&gt; E[&quot;เลือกสายต่อยอด&lt;br/&gt;Web, Data, Automation, AI&quot;]
