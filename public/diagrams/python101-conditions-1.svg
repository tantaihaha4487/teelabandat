<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="title desc"><title id="title">เลือกทางทำงานตามคะแนน</title><desc id="desc">รับคะแนน ถ้าคะแนนอย่างน้อย 80 แสดง ดีมาก หากยังไม่ถึงให้ตรวจว่าอย่างน้อย 50 หรือไม่ ถ้าใช่แสดง ผ่าน ถ้าไม่ใช่แสดง ต้องฝึกเพิ่ม</desc><metadata>flowchart TD
