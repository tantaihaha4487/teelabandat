<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">ลำดับการทำงานของ while loop</title><desc id="desc">ตรวจเงื่อนไขก่อน ถ้าเป็นจริงจะทำงานใน loop อัปเดตค่าที่เกี่ยวข้อง แล้วกลับไปตรวจเงื่อนไขใหม่ ถ้าเป็นเท็จจะออกจาก loop</desc><metadata>flowchart TD
  A[&quot;เริ่ม while&quot;] --&gt; B{&quot;เงื่อนไขเป็นจริงไหม?&quot;}
  B --&gt;|จริง| C[&quot;ทำงานใน loop&quot;]
  C --&gt; D[&quot;อัปเดตค่าที่เกี่ยวกับเงื่อนไข&quot;]
  D --&gt; B
  B --&gt;|เท็จ| E[&quot;ออกจาก loop&quot;]
</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6741a5"/></marker></defs><g font-family="IBM Plex Sans Thai,Noto Sans Thai,sans-serif"><rect x="225.0" y="21" width="270" height="58" rx="7" fill="#efe4f2" stroke="#6741a5"/><text x="360" y="50.0" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#352348">เริ่ม while</text><path d="M360 116L474 170L360 224L246 170Z" fill="#f1e9dd" stroke="#6741a5"/><text x="360" y="170.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#352348">เงื่อนไขเป็นจริงไหม?</text><rect x="225.0" y="271" width="270" height="58" rx="7" fill="#efe4f2" stroke="#6741a5"/><text x="360" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#352348">ทำงานใน loop</text><rect x="225.0" y="381" width="270" height="58" rx="7" fill="#efe4f2" stroke="#6741a5"/><text x="360" y="410.0" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#352348">อัปเดตค่าที่เกี่ยวกับเงื่อนไข</text><rect x="540.0" y="271" width="180" height="58" rx="7" fill="#efe4f2" stroke="#6741a5"/><text x="630" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#352348">ออกจาก loop</text><path d="M360 79V114" fill="none" stroke="#6741a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 224V269" fill="none" stroke="#6741a5" stroke-width="2" marker-end="url(#arrow)"/><text x="389" y="247.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#352348">จริง</text><path d="M360 329V379" fill="none" stroke="#6741a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M474 170H630V269" fill="none" stroke="#6741a5" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="149.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#352348">เท็จ</text><path d="M225 410H90V170H244" fill="none" stroke="#6741a5" stroke-width="2" marker-end="url(#arrow)"/><text x="145" y="290.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#352348">ตรวจเงื่อนไขอีกครั้ง</text></g></svg>