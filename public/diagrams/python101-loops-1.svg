<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" role="img" aria-labelledby="title desc"><title id="title">ลำดับการทำงานของ for loop</title><desc id="desc">เริ่ม loop แล้วหยิบค่าถัดไป ถ้ายังมีค่าจะทำงานใน block และกลับไปหยิบค่าถัดไปอีกครั้ง ถ้าไม่มีค่าจะออกจาก loop</desc><metadata>flowchart TD
